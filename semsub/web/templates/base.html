<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SemSub{% endblock %} - 智能字幕生成器</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <h1>SemSub</h1>
            <span class="tagline">智能字幕生成器</span>
        </div>
        <ul class="nav-menu">
            <li><a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
                <span class="icon">&#8962;</span> 首页
            </a></li>
            <li><a href="/generate" class="{% if request.url.path == '/generate' %}active{% endif %}">
                <span class="icon">&#9654;</span> 生成字幕
            </a></li>
            <li><a href="/batch" class="{% if request.url.path == '/batch' %}active{% endif %}">
                <span class="icon">&#9638;</span> 批量处理
            </a></li>
            <li><a href="/srt-process" class="{% if request.url.path == '/srt-process' %}active{% endif %}">
                <span class="icon">&#9998;</span> SRT处理
            </a></li>
            <li><a href="/workspaces" class="{% if request.url.path == '/workspaces' %}active{% endif %}">
                <span class="icon">&#128193;</span> 工作区
            </a></li>
            <li><a href="/config" class="{% if request.url.path == '/config' %}active{% endif %}">
                <span class="icon">&#9881;</span> 设置
            </a></li>
        </ul>
        <div class="sidebar-footer">
            <span>SemSub v1.0</span>
        </div>
    </nav>

    <main class="main-content">
        <header class="page-header">
            <h2>{% block page_title %}{% endblock %}</h2>
        </header>
        <div class="page-body">
            {% block content %}{% endblock %}
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="/static/js/app.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
